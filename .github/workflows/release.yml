name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

env:
  JJ_CONFIG: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release revision
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install --yes expect
      - name: Install tested jj baseline
        run: cargo install --locked jj-cli --version 0.44.0
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.93.1"
          command: check
          arguments: --all-features
      - name: Run the complete release gate
        run: ./scripts/verify.sh full

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_BASENAME: jjc-${{ github.event_name == 'push' && github.ref_name || github.sha }}-${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - name: Verify tag matches Cargo package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version="$(cargo pkgid | sed 's/.*[#@]//')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir "$ARCHIVE_BASENAME"
          cp "target/${{ matrix.target }}/release/jjc" "$ARCHIVE_BASENAME/"
          cp README.md LICENSE "$ARCHIVE_BASENAME/"
          tar -czf "$ARCHIVE_BASENAME.tar.gz" "$ARCHIVE_BASENAME"
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARCHIVE_BASENAME | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jjc.exe" "$env:ARCHIVE_BASENAME/"
          Copy-Item README.md, LICENSE "$env:ARCHIVE_BASENAME/"
          Compress-Archive -Path $env:ARCHIVE_BASENAME -DestinationPath "$env:ARCHIVE_BASENAME.zip"
      - name: Attest release archive
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE_BASENAME }}.${{ matrix.archive }}
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jjc-${{ matrix.target }}
          path: ${{ env.ARCHIVE_BASENAME }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jjc-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum jjc-* > SHA256SUMS
      - name: Verify immutable tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-tag.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
