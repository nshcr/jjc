name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  JJ_CONFIG: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo metadata --locked --no-deps --format-version 1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo install --locked --path . --root target/install-check --force
      - name: Check installed binary (Unix)
        if: runner.os != 'Windows'
        run: target/install-check/bin/jjc --version
      - name: Check installed binary (Windows)
        if: runner.os == 'Windows'
        run: target/install-check/bin/jjc.exe --version

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
          command: check
          arguments: --all-features

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  jj-integration:
    name: jj integration (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1
      - name: Install expect
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes expect
      - name: Install tested jj baseline
        run: cargo install --locked jj-cli --version 0.46.0
      - run: jj --version
      - name: Install jjc from the locked graph
        run: cargo install --locked --path . --root target/install-check --force
      - name: Check installed doctor output
        run: target/install-check/bin/jjc doctor
      - name: Run real jj and TTY tests
        shell: bash
        env:
          JJC_REQUIRE_INTEGRATION: "1"
          JJC_EXPECT_JJ_VERSION: "0.46.0"
        run: cargo test --locked --test smoke --test tty --test diff_tree_entries --test merge_markers 2>&1 | tee target/jj-integration.log
      - name: Retain protocol verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jj-integration-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            target/jj-integration.log
            target/protocol-evidence/*.log
          if-no-files-found: warn
          retention-days: 7

  latest-jj:
    name: latest jj advisory
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1
      - run: sudo apt-get update && sudo apt-get install --yes expect
      - name: Install latest jj build toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable install --locked jj-cli
      - run: jj --version
      - name: Probe latest jj protocol compatibility
        shell: bash
        env:
          JJC_REQUIRE_INTEGRATION: "1"
        run: |
          mkdir -p target
          {
            rustc --version
            jj --version
            cargo test --locked --test smoke --test tty --test diff_tree_entries --test merge_markers
          } 2>&1 | tee target/latest-jj-advisory.log
      - name: Retain advisory verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-jj-advisory-${{ github.run_attempt }}
          path: |
            target/latest-jj-advisory.log
            target/protocol-evidence/*.log
          if-no-files-found: warn
          retention-days: 7
